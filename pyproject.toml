[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "piitag"
version = "0.1.0"
description = "Python port of Desert Ant Labs' Redact on-device PII detector"
readme = "README.md"
license = { file = "LICENSE.md" }
requires-python = ">=3.10"
dependencies = [
    "huggingface_hub>=0.20",
    "numpy>=1.24",
    "regex>=2024.1",
]

[project.optional-dependencies]
litert = ["ai-edge-litert"]
tensorflow = ["tensorflow"]
dev = ["build", "mypy", "pytest", "pytest-cov", "ruff", "twine"]

[project.scripts]
piitag = "piitag.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/piitag"]

[tool.uv]
package = true

[tool.pytest.ini_options]
markers = ["slow: model-backed tests that require the downloaded TFLite assets"]

[dependency-groups]
dev = [
    "python-semantic-release>=10.6,<11",
    "uv==0.9.17",
]

[tool.semantic_release]
allow_zero_version = true
build_command = """
python -m pip install "uv==0.9.17"
uv lock --upgrade-package "$PACKAGE_NAME"
git add uv.lock
uv build
"""
commit_parser = "conventional"
tag_format = "v{version}"
version_toml = ["pyproject.toml:project.version"]

[tool.semantic_release.changelog]
exclude_commit_patterns = ["^chore\\(release\\):"]

[tool.semantic_release.remote]
token = { env = "GH_TOKEN" }
