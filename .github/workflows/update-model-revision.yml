name: Update Model Revision

on:
  schedule:
    # Run weekly on Monday at 04:00 UTC
    - cron: "0 4 * * 1"
  workflow_dispatch:

env:
  MODEL_REPO: "desert-ant-labs/redact"

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.16"

      - name: Install dependencies
        run: uv sync --python 3.14 --extra dev --extra litert

      - name: Get latest model revision
        id: revision
        run: |
          uv run scripts/get_latest_revision.py > revision_output.txt
          cat revision_output.txt
          # Export values for subsequent steps
          CURRENT=$(grep "^current=" revision_output.txt | cut -d= -f2)
          LATEST=$(grep "^latest=" revision_output.txt | cut -d= -f2)
          echo "current=$CURRENT" >> $GITHUB_OUTPUT
          echo "latest=$LATEST" >> $GITHUB_OUTPUT

      - name: Check if update needed
        id: check
        run: |
          CURRENT="${{ steps.revision.outputs.current }}"
          LATEST="${{ steps.revision.outputs.latest }}"
          echo "current=$CURRENT"
          echo "latest=$LATEST"

          if [ "$CURRENT" = "$LATEST" ]; then
            echo "update_needed=false" >> $GITHUB_OUTPUT
            echo "Already at latest revision: $CURRENT"
          else
            echo "update_needed=true" >> $GITHUB_OUTPUT
            echo "Newer revision available: $LATEST (current: $CURRENT)"
          fi

      - name: Exit if no update needed
        if: steps.check.outputs.update_needed == 'false'
        run: |
          echo "Repository is already at the latest model revision."
          exit 0

      - name: Create branch
        id: branch
        run: |
          LATEST="${{ steps.revision.outputs.latest }}"
          BRANCH_NAME="model-update-${LATEST}"
          echo "name=$BRANCH_NAME" >> $GITHUB_OUTPUT
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Delete branch if it exists (local or remote)
          git branch -D "$BRANCH_NAME" 2>/dev/null || true
          git push origin --delete "$BRANCH_NAME" 2>/dev/null || true
          git checkout -b "$BRANCH_NAME"

      - name: Update model revision file
        run: |
          LATEST="${{ steps.revision.outputs.latest }}"
          echo "$LATEST" > src/piitag/.model-revision
          echo "Updated src/piitag/.model-revision to $LATEST"

      - name: Verify changes
        run: |
          echo "=== src/piitag/.model-revision ==="
          cat src/piitag/.model-revision

      - name: Commit and push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT="${{ steps.revision.outputs.current }}"
          LATEST="${{ steps.revision.outputs.latest }}"
          BRANCH="${{ steps.branch.outputs.name }}"
          
          git add src/piitag/.model-revision
          git diff --cached --quiet || git commit -m "chore: update model revision to ${LATEST} [skip ci]" --no-verify
          git push "${BRANCH}"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ steps.branch.outputs.name }}
          base: main
          title: "chore: update model revision to ${{ steps.revision.outputs.latest }}"
          body: |
            ## Model Revision Update

            Automated PR to update the model revision from `${{ steps.revision.outputs.current }}` to `${{ steps.revision.outputs.latest }}`.

            ### Changes

            - Updated `src/piitag/.model-revision` file

            ### Verification Required

            Please verify:
            1. The new model version is compatible with the codebase
            2. All tests pass with the updated model
            3. No breaking changes were introduced

            ---

            *This PR was automatically generated by the `Update Model Revision` workflow.*
          labels: |
            automated
            model-update
          delete-branch: true